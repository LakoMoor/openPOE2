[package]
name = "poe2_bundles"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Offline engine for a locally installed Path of Exile 2 (unofficial)"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png"] }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
oozextract = "0.5.7"
serde_json = "1.0.154"
