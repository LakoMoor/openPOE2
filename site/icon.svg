<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="openPOE2 icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset="1" stop-color="#0b0807"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#f08a2c"/>
      <stop offset="1" stop-color="#b3391a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#3a2a22" stroke-width="3"/>

  <!-- outer ring, opened at the top ("open") -->
  <g filter="url(#glow)" fill="none" stroke="url(#ember)" stroke-linecap="round">
    <path d="M 296 78 A 180 180 0 1 1 216 78" stroke-width="14"/>
  </g>
  <!-- tick marks -->
  <g stroke="#7a4a2a" stroke-width="5" stroke-linecap="round">
    <path d="M256 462v-22M256 50v22" opacity="0"/>
    <path d="M436 256h-22M98 256h-22"/>
    <path d="M383 129l-15 15M144 368l-15 15M383 383l-15-15M144 144l-15-15"/>
  </g>
  <!-- inner ring -->
  <circle cx="256" cy="262" r="118" fill="none" stroke="#5c3a24" stroke-width="4"/>
  <circle cx="256" cy="262" r="118" fill="none" stroke="url(#ember)" stroke-width="4"
          stroke-dasharray="46 24" opacity=".8"/>

  <!-- central rune: diamond with an "2" stroke -->
  <g filter="url(#glow)">
    <path d="M256 168 L330 262 L256 356 L182 262 Z" fill="#150e0a" stroke="url(#ember)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M226 238 q0 -26 30 -26 q30 0 30 24 q0 14 -14 28 l-46 44 h62"
          fill="none" stroke="#ffd9a0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- spark at the opening -->
  <circle cx="256" cy="74" r="9" fill="#ffd27a" filter="url(#glow)"/>
</svg>
